spring:
  application:
    name: tomochi-server
  profiles:
    default: local
  config:
    # 로컬에서는 .env 파일에서 비밀값을 읽어요. 서버에서는 환경 변수로 넣어요.
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:tomochi}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 만들고, Hibernate는 엔티티와 맞는지만 확인해요.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

springdoc:
  paths-to-match: /api/v1/**
