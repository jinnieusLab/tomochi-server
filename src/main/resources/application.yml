spring:
  application:
    name: tomochi-server
  profiles:
    default: local
  config:
    # 로컬에서는 .env 파일에서 비밀값을 읽어요. 서버에서는 환경 변수로 넣어요.
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:tomochi}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 만들고, Hibernate는 엔티티와 맞는지만 확인해요.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          # 콜백 주소: {baseUrl}/api/v1/auth/oauth2/callback/{google|github} (docs/oauth.md)
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

tomochi:
  auth:
    jwt-secret: ${JWT_SECRET}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# Actuator는 API와 다른 포트(8081)에서만 열어요. 이 포트는 밖으로 내보내지 않고,
# 같은 Docker 네트워크의 Prometheus만 읽어요.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: tomochi-server

springdoc:
  paths-to-match: /api/v1/**
