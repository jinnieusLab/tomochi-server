# 부하 테스트용 로컬 구성. 평소 개발용(루트 docker-compose.yml)과 DB·포트가 겹치지 않아요.
# 값은 같은 폴더의 .env에서 읽어요 (.env.example 참고).
#
#   ./gradlew bootJar
#   docker compose -f loadtest/docker-compose.yml up -d --build
#
# 앱·MySQL·Redis에 CPU·메모리 상한을 둬서 VPS 1대(기본 2코어·2GB)처럼 만들어요.
# 맥이 VPS보다 빨라서 절대 숫자는 실제 VPS에서 다시 재야 해요 (docs/load-test.md).
name: tomochi-loadtest

services:
  app:
    build:
      context: ..
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: tomochi
      DB_USERNAME: tomochi
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      # 소셜 로그인은 쓰지 않지만 비어 있으면 앱이 뜨지 않아요.
      GOOGLE_CLIENT_ID: loadtest
      GOOGLE_CLIENT_SECRET: loadtest
      GITHUB_CLIENT_ID: loadtest
      GITHUB_CLIENT_SECRET: loadtest
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18081:8081"
    cpus: ${APP_CPUS:-1.0}
    mem_limit: ${APP_MEM:-1g}
    ulimits:
      nofile: 65536
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tomochi
      MYSQL_USER: tomochi
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    # 시드 데이터를 넣을 때만 맥에서 붙어요.
    ports:
      - "127.0.0.1:13307:3306"
    cpus: ${MYSQL_CPUS:-0.7}
    mem_limit: ${MYSQL_MEM:-768m}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    cpus: ${REDIS_CPUS:-0.3}
    mem_limit: ${REDIS_MEM:-256m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 테스트 중 지표를 5초마다 모아요.
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  # http://localhost:13000 — 맥 안에서만 열려서 로그인 없이 봐요.
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - ../deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  mysql-data:
